name: Bilanciamento

# Il simulatore di bilanciamento in versione lunga: un anno di gioco, tre
# semi per profilo. Gira solo a mano (ogni notte costerebbe fino a 1.800
# minuti al mese sul repo privato); il rapporto resta nel riepilogo e come
# artefatto. Non compila né pubblica APK.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Giorni da simulare"
        default: "365"
      seeds:
        description: "Partite per profilo"
        default: "3"

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: >
          flutter test test/balance
          --dart-define=SIM_DAYS=${{ inputs.days || '365' }}
          --dart-define=SIM_SEEDS=${{ inputs.seeds || '3' }}
      - if: always()
        run: cat build/balance/report.md build/balance/builds.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilanciamento-lungo
          path: build/balance/*.md
          if-no-files-found: ignore
