name: CI

# Il repo è privato: il piano gratuito dà 2.000 minuti al mese. A ogni push
# girano solo analisi, test (con il simulatore di bilanciamento) e il server,
# pochi minuti. APK, emulatori e pubblicazione partono solo a mano, da
# Actions → CI → Run workflow (o con l'API workflow_dispatch sul ramo voluto).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulatori:
        description: "Prova l'APK su 3 emulatori Android prima di pubblicarlo (circa 30 minuti in più)"
        type: boolean
        default: true
      ios:
        description: "Compila anche iOS (senza firma, su macOS: minuti x10)"
        type: boolean
        default: false

# Un push nuovo sullo stesso ramo ferma la prova vecchia ancora in corso.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Il simulatore di bilanciamento gira dentro flutter test: il suo
      # rapporto finisce nel riepilogo della CI e come artefatto.
      - if: always()
        run: cat build/balance/report.md build/balance/builds.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilanciamento
          path: build/balance/*.md
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node --test test/arena.test.js

  # Da qui in giù solo a mano: sono i job che consumano più minuti.
  android:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Numero di build crescente: ogni APK si installa sopra il precedente.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk iron-oath.apk
      # Versione solo per telefoni a 64 bit (quasi tutti dal 2019): circa la
      # metà del peso. Stesso numero di build, quindi si aggiorna sopra.
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk iron-oath-arm64.apk
      - run: ls -lh *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iron-oath-android
          path: |
            iron-oath.apk
            iron-oath-arm64.apk

  # Avvia l'APK vero su emulatori Android (vecchio e recente) e fallisce se
  # l'app si chiude all'avvio. Il logcat resta come artefatto.
  android-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.emulatori
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iron-oath-android
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level == 34 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          script: |
            adb install -r iron-oath.apk
            adb logcat -c || true
            adb shell am start -W -n com.ironoath.iron_oath/.MainActivity
            sleep 20
            adb logcat -d > logcat.txt || true
            adb shell screencap -p /sdcard/s.png && adb pull /sdcard/s.png screen.png || true
            grep -E "FATAL EXCEPTION|AndroidRuntime|E/flutter|libc  |DEBUG   " logcat.txt | head -80 || true
            adb shell pidof com.ironoath.iron_oath
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-${{ matrix.api-level }}
          path: |
            logcat.txt
            screen.png
          if-no-files-found: ignore

  # APK scaricabile direttamente dal telefono, senza zip e senza login:
  # release "apk-latest" ricreata nel repo PUBBLICO che contiene solo gli APK
  # (vars.APK_REPO, di base claudiotonello26-prog/gym-oath-apk), con il token
  # del segreto APK_REPO_TOKEN. Senza quel segreto pubblica in questo repo,
  # che però da privato richiede il login per scaricare.
  publish-apk:
    needs: [android, android-smoke]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      needs.android.result == 'success' &&
      (needs.android-smoke.result == 'success' || needs.android-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iron-oath-android
      - name: Pubblica l'APK
        env:
          APK_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.APK_REPO_TOKEN || github.token }}
          GH_REPO: ${{ secrets.APK_REPO_TOKEN && (vars.APK_REPO || 'claudiotonello26-prog/gym-oath-apk') || github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Nel repo degli APK il commit del codice non esiste: la release
          # si appoggia al suo ramo principale.
          TARGET=()
          if [ -z "$APK_TOKEN" ]; then TARGET=(--target "$SHA"); fi
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest iron-oath-arm64.apk iron-oath.apk \
            --prerelease "${TARGET[@]}" \
            --title "Iron Oath – APK di prova (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} dal ramo $BRANCH (${SHA:0:7}). Scarica iron-oath-arm64.apk dal telefono e installalo sopra la versione precedente; iron-oath.apk funziona su tutti i telefoni ma pesa di più."
          echo "Link fisso: https://github.com/$GH_REPO/releases/download/apk-latest/iron-oath-arm64.apk" >> "$GITHUB_STEP_SUMMARY"

  # IPA non firmata: si installa su iPhone da Windows con Sideloadly e un
  # Apple ID gratuito. Gira su macOS (ogni minuto ne vale 10), quindi solo a
  # mano da Actions → CI → Run workflow con la casella iOS.
  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Crea l'IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr iron-oath.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iron-oath-ios
          path: iron-oath.ipa
