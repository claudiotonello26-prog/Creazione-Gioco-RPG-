name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: "Compila anche iOS (senza firma, su macOS)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Numero di build crescente: ogni APK si installa sopra il precedente.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk iron-oath.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iron-oath-android
          path: iron-oath.apk

  # IPA non firmata: si installa su iPhone da Windows con Sideloadly e un
  # Apple ID gratuito. Gira su macOS (minuti costosi), quindi solo su main o
  # a mano da Actions → CI → Run workflow.
  ios:
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Crea l'IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr iron-oath.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iron-oath-ios
          path: iron-oath.ipa
